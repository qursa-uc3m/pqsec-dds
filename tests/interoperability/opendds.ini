# OpenDDS participant of run.sh, which replaces @PQSEC_OPENDDS_LIB@.
# Unicast discovery on the loopback interface: SPDP goes to the ports
# CycloneDDS takes for participant indices 0 to 3.

[common]
DCPSSecurity=1
DCPSGlobalSecurityConfig=pqsec
DCPSDefaultDiscovery=unicast
DCPSGlobalTransportConfig=$file

[security_plugin/PQSec]
Library=@PQSEC_OPENDDS_LIB@
Loader=PQSecPluginLoader

[security/pqsec]
AuthConfig=PQSec
AccessCtrlConfig=BuiltIn
CryptoConfig=BuiltIn
UtilityConfig=BuiltIn

[rtps_discovery/unicast]
SpdpPortMode=probe
SedpMulticast=0
SpdpLocalAddress=127.0.0.1
SedpLocalAddress=127.0.0.1:
SpdpSendAddrs=127.0.0.1:7410,127.0.0.1:7412,127.0.0.1:7414,127.0.0.1:7416

[transport/udp]
transport_type=rtps_udp
use_multicast=0
local_address=127.0.0.1:
